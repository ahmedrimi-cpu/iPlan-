<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Plan</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F3ECDA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Plan">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3ECDA; --paper:#FBF6EA; --paper-2:#F0E7D2; --line:#E0D3B4;
  --ink:#332B22; --ink-muted:#8A7A62; --ink-faint:#B7A984;
  --accent:#A8452E; --accent-dim:#EFDCCF;
  --gold:#8C6A2F; --gold-dim:#EDE2C4;
  --sage:#5B7460; --sage-dim:#DCE6D9;
  --slate:#4B5D73; --slate-dim:#DCE3EA;
  --now:#A8452E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;overscroll-behavior:none;}
body{padding-bottom:96px;background-image:radial-gradient(circle at 20% 10%, rgba(168,69,46,0.03), transparent 40%);}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}

.header{padding:22px 18px 8px;}
.header-row{display:flex;align-items:baseline;justify-content:space-between;}
.header .app-name{font-family:'Fraunces';font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);}
.header .date-main{font-size:23px;font-weight:700;margin-top:2px;}
.header .date-sub{color:var(--ink-muted);font-weight:400;font-size:15px;margin-left:5px;font-family:'Inter';}
.icon-btn{background:var(--paper);border:1px solid var(--line);color:var(--ink-muted);font-size:16px;padding:8px 10px;border-radius:10px;}

.strip{display:flex;gap:6px;padding:14px 14px 4px;overflow-x:auto;}
.strip::-webkit-scrollbar{display:none;}
.strip-day{flex:1;min-width:42px;text-align:center;padding:8px 0 6px;border-radius:14px;cursor:pointer;}
.strip-day.selected{background:var(--accent-dim);}
.strip-day .dow{font-size:9.5px;color:var(--ink-faint);letter-spacing:0.5px;}
.strip-day .num{font-size:17px;font-weight:700;margin-top:2px;color:var(--ink);}
.strip-day.selected .num{color:var(--accent);}
.strip-dots{display:flex;gap:2px;justify-content:center;margin-top:5px;}
.strip-dots span{width:4px;height:4px;border-radius:50%;}

.view{display:none;}
.view.active{display:block;}

.timeline{padding:16px 14px 8px;}
.trow{display:flex;gap:12px;margin-bottom:2px;position:relative;}
.ttime{width:44px;flex-shrink:0;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-faint);padding-top:16px;text-align:right;}
.trail{width:34px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative;}
.trail::before{content:'';position:absolute;top:0;bottom:0;width:1px;background:var(--line);}
.ticon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1;margin-top:6px;}
.tcard{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;min-height:20px;cursor:pointer;}
.tcard.prayer{background:var(--sage-dim);border-color:var(--sage-dim);padding:10px 14px;cursor:default;}
.ttitle{font-size:14.5px;font-weight:600;color:var(--ink);}
.tsub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.tstatus{flex-shrink:0;margin-left:10px;}
.progress-badge{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;}
.status-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-faint);}
.status-circle.checked{background:var(--accent);border-color:var(--accent);position:relative;}
.status-circle.checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FBF6EA;font-size:11px;font-weight:700;}
.chev{color:var(--ink-faint);font-size:15px;margin-left:6px;}

.now-row{display:flex;align-items:center;gap:12px;margin:6px 0 12px;}
.now-time{width:44px;flex-shrink:0;font-family:'IBM Plex Mono';font-size:11px;color:var(--now);text-align:right;font-weight:600;}
.now-line{flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--now) 0 6px,transparent 6px 11px);position:relative;margin-left:2px;}
.now-line::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--now);}
.now-label{font-family:'IBM Plex Mono';font-size:10px;color:var(--now);font-weight:700;letter-spacing:0.5px;margin-left:6px;}

.subtasks{padding:0 14px 6px 90px;margin-top:-8px;margin-bottom:10px;}
.subtask-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.subtask-row:last-child{border-bottom:none;}
.subtask-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-faint);flex-shrink:0;cursor:pointer;}
.subtask-check.done{background:var(--sage);border-color:var(--sage);position:relative;}
.subtask-check.done::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FBF6EA;font-size:11px;}
.subtask-row.done span{text-decoration:line-through;color:var(--ink-faint);}
.subtask-row span{flex:1;}
.subtask-del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:2px 4px;}
.subtask-add{display:flex;gap:6px;padding:8px 0 2px;}
.subtask-add input{flex:1;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:8px;font-size:12.5px;}
.subtask-add button{background:var(--accent-dim);color:var(--accent);border:none;border-radius:8px;padding:0 12px;font-weight:700;font-size:12px;}
.routine-edit-link{font-size:11px;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 0 2px;}

.drawer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;border-top:1px solid var(--line);z-index:30;box-shadow:0 -8px 24px rgba(51,43,34,0.12);transition:max-height 0.25s ease;overflow:hidden;}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;cursor:pointer;position:relative;}
.drawer-head .handle{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:34px;height:4px;background:var(--line);border-radius:3px;}
.drawer-title{font-size:12px;font-weight:700;letter-spacing:0.4px;color:var(--ink-muted);text-transform:uppercase;}
.drawer-body{padding:0 14px 18px;}
.dtask{display:flex;align-items:center;gap:12px;background:var(--paper-2);border-radius:12px;padding:12px 12px;margin-bottom:8px;}
.dtask .dcheck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-faint);flex-shrink:0;cursor:pointer;}
.dtask .dcheck.done{background:var(--accent);border-color:var(--accent);position:relative;}
.dtask .dcheck.done::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FBF6EA;font-size:12px;}
.dtask span{flex:1;font-size:14px;cursor:pointer;}
.dtask span.done{text-decoration:line-through;color:var(--ink-faint);}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.add-task-row{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:14px;font-weight:600;padding:10px 4px;cursor:pointer;}

.week-wrap{padding:16px 14px;}
.week-day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.week-day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.week-day-head .wd-date{font-family:'Fraunces';font-size:15px;font-weight:600;}
.week-day-head .wd-date.today{color:var(--accent);}
.wd-count{font-size:11px;color:var(--ink-muted);font-family:'IBM Plex Mono';}
.wd-blocks{display:flex;gap:5px;flex-wrap:wrap;}
.wd-chip{font-size:10.5px;padding:4px 9px;border-radius:8px;background:var(--paper-2);color:var(--ink-muted);}

.inbox-wrap{padding:16px 14px;}
.area-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.area-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;}
.area-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;}
.area-count{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-muted);}
.area-items{border-top:1px solid var(--line);padding:6px 14px 10px;display:none;}
.area-items.open{display:block;}
.area-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
.area-item:last-child{border-bottom:none;}
.area-item span{flex:1;font-size:13.5px;cursor:pointer;}
.area-item .promote{font-size:10.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:none;}
.area-item .idel{background:none;border:none;color:var(--ink-faint);font-size:16px;padding:2px 4px;}
.area-add{display:flex;gap:8px;padding:10px 4px 4px;}
.area-add input{flex:1;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:9px;font-size:13px;}
.area-add button{background:var(--accent-dim);color:var(--accent);border:none;border-radius:9px;padding:0 14px;font-weight:700;}

.settings-wrap{padding:16px 14px;}
.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.settings-card h3{font-size:15px;margin-bottom:10px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.settings-row label{font-size:13.5px;}
.settings-row input[type=time]{background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:8px;font-size:13px;}
.settings-note{font-size:11.5px;color:var(--ink-muted);margin-top:8px;line-height:1.5;}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;padding:10px 10px 22px;z-index:40;}
.nav-item{flex:1;text-align:center;background:none;border:none;color:var(--ink-faint);font-size:9.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-item .ni-icon{font-size:19px;}
.nav-item.active{color:var(--accent);}

.sheet-backdrop{position:fixed;inset:0;background:rgba(51,43,34,0.35);display:none;align-items:flex-end;justify-content:center;z-index:60;}
.sheet-backdrop.open{display:flex;}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:88vh;overflow-y:auto;}
.sheet-handle{width:34px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
.capture-input{width:100%;background:none;border:none;color:var(--ink);font-size:19px;font-family:'Fraunces';padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.capture-input:focus{outline:none;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:8px 13px;border-radius:20px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-muted);font-size:12.5px;cursor:pointer;font-weight:500;}
.chip.selected{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-dim);}
.more-toggle{color:var(--ink-faint);font-size:12px;padding:6px 0;cursor:pointer;text-decoration:underline;}
.more-fields{display:none;margin-top:10px;}
.more-fields.open{display:block;}
.field{margin-bottom:12px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.field label{display:block;font-size:10.5px;color:var(--ink-muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
.field input, .field select{width:100%;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:10px 11px;border-radius:9px;font-size:13.5px;}
.dow-group{display:flex;gap:5px;}
.dow{flex:1;padding:8px 0;text-align:center;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-muted);font-size:10.5px;font-family:'IBM Plex Mono';cursor:pointer;}
.dow.selected{background:var(--sage-dim);color:var(--sage);border-color:var(--sage-dim);}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
.btn-primary{background:var(--accent);color:#FBF6EA;}
.btn-ghost{background:var(--paper-2);color:var(--ink-muted);}
.btn-danger{background:#F3DCD5;color:var(--accent);}

.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <div class="app-name">My Plan</div>
      <div><span class="date-main" id="hMain">Mon, 24</span><span class="date-sub" id="hSub">August 2026</span></div>
    </div>
    <div style="display:flex;gap:6px;"><button class="icon-btn" id="headerAddBtn">＋ Add</button><button class="icon-btn" id="settingsBtn">⚙</button></div>
  </div>
</div>

<div class="strip" id="strip"></div>

<div class="view active" id="viewToday">
  <div class="timeline" id="timeline"></div>
</div>

<div class="view" id="viewWeek">
  <div class="week-wrap" id="weekWrap"></div>
</div>

<div class="view" id="viewInbox">
  <div class="inbox-wrap" id="inboxWrap"></div>
</div>

<div class="view" id="viewSettings">
  <div class="settings-wrap">
    <div class="settings-card">
      <h3>Prayer times</h3>
      <div class="settings-row"><label>Fajr</label><input type="time" id="prFajr"></div>
      <div class="settings-row"><label>Dhuhr</label><input type="time" id="prDhuhr"></div>
      <div class="settings-row"><label>Asr</label><input type="time" id="prAsr"></div>
      <div class="settings-row"><label>Maghrib</label><input type="time" id="prMaghrib"></div>
      <div class="settings-row"><label>Isha</label><input type="time" id="prIsha"></div>
      <div class="settings-note">Set these to match your masjid's actual times. Update whenever they shift — no automatic calculation yet.</div>
      <div class="sheet-actions"><button class="btn btn-primary" id="savePrayerBtn">Save times</button></div>
    </div>
    <div class="settings-card">
      <h3>About</h3>
      <div class="settings-note">My Plan — your inbox, timeline and routines in one place. Data is stored only on this device.</div>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" style="max-height:52px;">
  <div class="drawer-head" id="drawerHead">
    <div class="handle"></div>
    <div class="drawer-title" id="drawerTitle">3 THINGS TO DO TODAY</div>
    <div style="color:var(--ink-muted);font-size:13px;" id="drawerChevron">▲</div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="bottomnav">
  <button class="nav-item" data-view="inbox"><span class="ni-icon">▣</span>Inbox</button>
  <button class="nav-item active" data-view="today"><span class="ni-icon">☉</span>Today</button>
  <button class="nav-item" data-view="week"><span class="ni-icon">▦</span>Week</button>
  <button class="nav-item" id="navSettings"><span class="ni-icon">⚙</span>Settings</button>
</div>

<div class="sheet-backdrop" id="captureBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <input type="text" class="capture-input" id="captureInput" placeholder="What's on your mind?">
    <div class="chip-row" id="quickChips">
      <div class="chip" id="chipToday">Today</div>
      <div class="chip" id="chipWhen">When…</div>
    </div>
    <div class="field" id="areaField"><label>Area</label>
      <select id="fArea"></select>
    </div>
    <div class="row2" id="timeField" style="display:none;">
      <div class="field"><label>Starts</label><input type="time" id="fTime"></div>
      <div class="field"><label>Ends (optional)</label><input type="time" id="fEndTime"></div>
    </div>
    <div class="more-toggle" id="moreToggle">More options</div>
    <div class="more-fields" id="moreFields">
      <div class="field"><label>Notes</label><input type="text" id="fNotes" placeholder="Optional context"></div>
      <div class="field" id="repeatField" style="display:none;"><label>Repeat</label>
        <select id="fRepeat">
          <option value="none">Once</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly (choose days)</option>
        </select>
      </div>
      <div class="field" id="dowField" style="display:none;">
        <label>Days</label>
        <div class="dow-group" id="dowGroup"></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="captureCancel">Cancel</button>
      <button class="btn btn-danger" id="captureDelete" style="display:none;">Delete</button>
      <button class="btn btn-primary" id="captureSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const storage = {
  async get(key){ const v = localStorage.getItem(key); return v !== null ? {key, value: v} : null; },
  async set(key, value){ localStorage.setItem(key, value); return {key, value}; },
};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AREAS = [
  {id:'startup', name:'Startup', color:'var(--slate)'},
  {id:'certs', name:'Certifications', color:'var(--gold)'},
  {id:'kpmg', name:'KPMG', color:'var(--sage)'},
  {id:'personal', name:'Personal', color:'var(--accent)'},
];
const MORNING_SUBTASKS = ['Morning adhkar','Quran','Supplements','Stretch','Run / Gym','Breakfast'];
const NIGHT_SUBTASKS = ['Wudu','Al-Mulk','Ayat al-Kursi','Adhkar','Sleep dua'];

let state = null;
let viewDate = new Date();
let editKind = null; // 'item' | 'block'
let editId = null;
let captureRepeat = 'none';
let captureDows = new Set();
let captureToday = false;

function pad(n){return n.toString().padStart(2,'0');}
function fmt12(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const hr=((h+11)%12)+1; const ap=h<12?'am':'pm'; return hr+':'+pad(m)+' '+ap; }
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,6);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function defaults(){
  return {
    areas: AREAS,
    items: [
      {id:uid(), title:'Audit startup signup data', areaId:'startup', today:true, completed:false},
      {id:uid(), title:'Reply to Ahmed', areaId:'personal', today:true, completed:false},
      {id:uid(), title:'Look into certifications', areaId:'certs', today:true, completed:false},
    ],
    blocks: [
      {id:uid(), title:'Run', sub:'~30 min', time:'07:30', icon:'runner', color:'var(--accent)', dim:'var(--accent-dim)', checkable:true, days:[0,1,2,3,4,5,6]},
      {id:uid(), title:'Work', sub:'', time:'09:00', endTime:'17:00', icon:'work', color:'var(--slate)', dim:'var(--slate-dim)', checkable:false, days:[1,2,3,4,5]},
      {id:uid(), title:'Quran Class', sub:'', time:'18:45', endTime:'19:45', icon:'book', color:'var(--gold)', dim:'var(--gold-dim)', checkable:false, days:[1,3,4]},
      {id:uid(), title:'Class · Sheikh M. Ali', sub:'', time:'20:15', endTime:'21:30', icon:'star', color:'var(--gold)', dim:'var(--gold-dim)', checkable:false, days:[6,0]},
      {id:uid(), title:'Home / Wife / Dinner', sub:'~1 hr', time:'22:30', icon:'heart', color:'var(--accent)', dim:'var(--accent-dim)', checkable:false, days:[0,1,2,3,4,5,6]},
    ],
    routines: [
      {id:uid(), title:'Morning Routine', time:'05:20', icon:'sun', color:'var(--gold)', dim:'var(--gold-dim)', subtasks: MORNING_SUBTASKS, days:[0,1,2,3,4,5,6]},
      {id:uid(), title:'Night Routine', time:'23:45', icon:'moon', color:'var(--slate)', dim:'var(--slate-dim)', subtasks: NIGHT_SUBTASKS, days:[0,1,2,3,4,5,6]},
    ],
    completions:{}, todayFlags:{},
    prayerTimes: { fajr:'04:45', dhuhr:'13:17', asr:'16:49', maghrib:'19:58', isha:'21:22' },
  };
}
const ICONS = {runner:'🏃',work:'💼',book:'📖',star:'✦',heart:'♥',sun:'☀',moon:'☾'};

async function loadData(){
  try{ const r = await storage.get('lifeplan:state'); state = r ? JSON.parse(r.value) : null; }
  catch(e){ state = null; }
  if(!state){ state = defaults(); await save(); }
  if(!state.prayerTimes) state.prayerTimes = defaults().prayerTimes;
}
async function save(){ try{ await storage.set('lifeplan:state', JSON.stringify(state)); }catch(e){ console.error(e); } }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }

function renderHeader(){
  document.getElementById('hMain').textContent = viewDate.toLocaleDateString('en-GB',{weekday:'short', day:'numeric'});
  document.getElementById('hSub').textContent = viewDate.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
}
function itemsForDate(d){
  const dow = d.getDay();
  return { blocks: state.blocks.filter(b=>b.days.includes(dow)), routines: state.routines.filter(r=>r.days.includes(dow)) };
}
function renderStrip(){
  const strip = document.getElementById('strip');
  const start = new Date(viewDate); start.setDate(start.getDate() - start.getDay() + 1);
  let html='';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const sel = dstr(d)===dstr(viewDate);
    const dayItems = itemsForDate(d);
    const dots = dayItems.blocks.slice(0,3).map(b=>`<span style="background:${b.color}"></span>`).join('');
    html += `<div class="strip-day ${sel?'selected':''}" data-date="${dstr(d)}">
      <div class="dow">${DOW[d.getDay()].toUpperCase()}</div><div class="num">${d.getDate()}</div>
      <div class="strip-dots">${dots}</div></div>`;
  }
  strip.innerHTML = html;
  strip.querySelectorAll('.strip-day').forEach(el=>{ el.onclick=()=>{ viewDate=new Date(el.dataset.date+'T12:00:00'); renderAll(); }; });
}

function renderTimeline(){
  const ds = dstr(viewDate);
  const {blocks, routines} = itemsForDate(viewDate);
  const P = state.prayerTimes;
  const prayers = [
    {name:'Fajr', time:P.fajr, sub:'Prayer time'},
    {name:'Dhuhr', time:P.dhuhr, sub:'Prayer time'},
    {name:'Asr', time:P.asr, sub:'Prayer time'},
    {name:'Maghrib', time:P.maghrib, sub:'Prayer time'},
    {name:'Isha', time:P.isha, sub:'Prayer time'},
  ];
  let entries = [];
  prayers.forEach(p=> entries.push({type:'prayer', time:p.time, data:p}));
  blocks.forEach(b=> entries.push({type:'block', time:b.time, data:b}));
  routines.forEach(r=> entries.push({type:'routine', time:r.time, data:r}));
  entries.sort((a,b)=> a.time.localeCompare(b.time));

  const now = new Date();
  const nowStr = pad(now.getHours())+':'+pad(now.getMinutes());
  const isToday = dstr(now)===ds;
  let html=''; let nowInserted=false;
  entries.forEach(e=>{
    if(isToday && !nowInserted && e.time > nowStr){ html += nowRowHtml(nowStr); nowInserted=true; }
    if(e.type==='prayer'){
      html += `<div class="trow"><div class="ttime">${e.time}</div>
        <div class="trail"><div class="ticon" style="background:var(--sage-dim);color:var(--sage);">🕌</div></div>
        <div class="tcard prayer"><div><div class="ttitle" style="font-size:13.5px;">${e.data.name}</div><div class="tsub">${e.data.sub}</div></div><div class="tstatus">🕌</div></div></div>`;
    } else if(e.type==='block'){
      const b=e.data; const doneKey=ds+'::block::'+b.id; const done=!!state.completions[doneKey];
      b._displaySub = b.endTime ? (fmt12(b.time)+' – '+fmt12(b.endTime)) : (b.sub||'');
      const statusHtml = b.checkable
        ? `<div class="status-circle ${done?'checked':''}" data-blockcheck="${b.id}"></div>`
        : `<div class="status-circle" style="border-color:${b.color}"></div>`;
      html += `<div class="trow"><div class="ttime">${b.time}</div>
        <div class="trail"><div class="ticon" style="background:${b.dim};color:${b.color};">${ICONS[b.icon]||'•'}</div></div>
        <div class="tcard" data-blockedit="${b.id}"><div><div class="ttitle">${esc(b.title)}</div><div class="tsub">${esc(b._displaySub||'')}</div></div><div class="tstatus" data-stopprop="1">${statusHtml}</div></div></div>`;
    } else if(e.type==='routine'){
      const r=e.data; const doneCount = r.subtasks.filter((s,i)=> state.completions[ds+'::routine::'+r.id+'::'+i]).length;
      const expanded = state._expanded === r.id;
      html += `<div class="trow"><div class="ttime">${r.time}</div>
        <div class="trail"><div class="ticon" style="background:${r.dim};color:${r.color};">${ICONS[r.icon]||'•'}</div></div>
        <div class="tcard" data-routinetoggle="${r.id}"><div><div class="ttitle">${esc(r.title)}</div><div class="tsub">${doneCount} / ${r.subtasks.length} complete</div></div>
        <div class="tstatus" style="display:flex;align-items:center;"><span class="progress-badge" style="color:${r.color}">${doneCount}/${r.subtasks.length}</span><span class="chev">${expanded?'▾':'▸'}</span></div></div></div>`;
      if(expanded){
        html += `<div class="subtasks">`;
        r.subtasks.forEach((s,i)=>{
          const key = ds+'::routine::'+r.id+'::'+i; const d=!!state.completions[key];
          html += `<div class="subtask-row ${d?'done':''}"><div class="subtask-check ${d?'done':''}" data-subtoggle="${key}"></div><span>${esc(s)}</span><button class="subtask-del" data-subdel="${r.id}::${i}">×</button></div>`;
        });
        html += `<div class="subtask-add"><input type="text" placeholder="Add step…" id="newSubInput-${r.id}"><button data-subadd="${r.id}">Add</button></div>`;
        html += `<div class="routine-edit-link" data-routinemeta="${r.id}">Edit time / days / delete routine</div>`;
        html += `</div>`;
      }
    }
  });
  if(isToday && !nowInserted){ html += nowRowHtml(nowStr); }
  document.getElementById('timeline').innerHTML = html || '<div style="text-align:center;color:var(--ink-muted);padding:40px 20px;">Nothing scheduled for this day.</div>';

  document.querySelectorAll('[data-routinetoggle]').forEach(el=>{
    el.onclick = (ev)=>{ if(ev.target.closest('[data-stopprop]')) return; state._expanded = (state._expanded===el.dataset.routinetoggle)?null:el.dataset.routinetoggle; renderTimeline(); };
  });
  document.querySelectorAll('[data-subtoggle]').forEach(el=>{
    el.onclick = async (ev)=>{ ev.stopPropagation(); const k=el.dataset.subtoggle; state.completions[k]=!state.completions[k]; await save(); renderTimeline(); };
  });
  document.querySelectorAll('[data-subdel]').forEach(el=>{
    el.onclick = async (ev)=>{ ev.stopPropagation(); const [rid,idx]=el.dataset.subdel.split('::'); const r=state.routines.find(x=>x.id===rid); r.subtasks.splice(parseInt(idx),1); await save(); renderTimeline(); };
  });
  document.querySelectorAll('[data-subadd]').forEach(el=>{
    el.onclick = async (ev)=>{ ev.stopPropagation(); const rid=el.dataset.subadd; const input=document.getElementById('newSubInput-'+rid); const v=input.value.trim(); if(!v) return; const r=state.routines.find(x=>x.id===rid); r.subtasks.push(v); await save(); renderTimeline(); };
  });
  document.querySelectorAll('[data-routinemeta]').forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation(); openEditRoutineMeta(el.dataset.routinemeta); };
  });
  document.querySelectorAll('[data-blockcheck]').forEach(el=>{
    el.onclick = async (ev)=>{ ev.stopPropagation(); const k=ds+'::block::'+el.dataset.blockcheck; state.completions[k]=!state.completions[k]; await save(); renderTimeline(); };
  });
  document.querySelectorAll('[data-blockedit]').forEach(el=>{
    el.onclick = (ev)=>{ if(ev.target.closest('[data-stopprop]')) return; openEditBlock(el.dataset.blockedit); };
  });
}
function nowRowHtml(nowStr){ return `<div class="now-row"><div class="now-time">${nowStr}</div><div class="now-line"></div><div class="now-label">NOW</div></div>`; }

function renderDrawer(){
  const todayItems = state.items.filter(i=> i.today && !i.completed);
  document.getElementById('drawerTitle').textContent = `${todayItems.length} THING${todayItems.length===1?'':'S'} TO DO TODAY`;
  let html='';
  todayItems.forEach(i=>{
    const area = state.areas.find(a=>a.id===i.areaId);
    html += `<div class="dtask"><div class="dcheck" data-itemdone="${i.id}"></div><span data-itemedit="${i.id}">${esc(i.title)}</span><div class="dot" style="background:${area?area.color:'var(--ink-muted)'}"></div></div>`;
  });
  html += `<div class="add-task-row" id="drawerAddTask">＋ Add task</div>`;
  document.getElementById('drawerBody').innerHTML = html;
  document.querySelectorAll('[data-itemdone]').forEach(el=>{
    el.onclick = async ()=>{ const item=state.items.find(x=>x.id===el.dataset.itemdone); item.completed=true; await save(); renderDrawer(); showToast('Marked done'); };
  });
  document.querySelectorAll('[data-itemedit]').forEach(el=>{
    el.onclick = ()=> openEditItem(el.dataset.itemedit);
  });
  document.getElementById('drawerAddTask').onclick = ()=> openCapture({defaultToday:true});
}
let drawerOpen=false;
document.getElementById('drawerHead').onclick = ()=>{
  drawerOpen=!drawerOpen;
  document.getElementById('drawer').style.maxHeight = drawerOpen?'60vh':'52px';
  document.getElementById('drawerChevron').textContent = drawerOpen?'▾':'▲';
  document.getElementById('drawerBody').style.overflowY = drawerOpen?'auto':'hidden';
};

function renderWeek(){
  const start = new Date(viewDate); start.setDate(start.getDate() - start.getDay() + 1);
  let html='';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const isToday = dstr(d)===dstr(new Date());
    const {blocks, routines} = itemsForDate(d);
    const chips = [...routines.map(r=>r.title), ...blocks.map(b=>b.title)];
    html += `<div class="week-day"><div class="week-day-head"><div class="wd-date ${isToday?'today':''}">${DOW[d.getDay()]} ${d.getDate()}</div><div class="wd-count">${chips.length} scheduled</div></div>
      <div class="wd-blocks">${chips.map(c=>`<div class="wd-chip">${esc(c)}</div>`).join('') || '<div class="wd-chip">Free</div>'}</div></div>`;
  }
  document.getElementById('weekWrap').innerHTML = html;
}

function renderInbox(){
  let html='';
  state.areas.forEach(a=>{
    const items = state.items.filter(i=> i.areaId===a.id && !i.completed);
    const openState = state._areaOpen===a.id;
    html += `<div class="area-card"><div class="area-head" data-areatoggle="${a.id}">
        <div class="area-name"><span class="dot" style="background:${a.color}"></span>${a.name}</div><div class="area-count">${items.length}</div></div>
      <div class="area-items ${openState?'open':''}">
        ${items.map(i=>`<div class="area-item"><span data-itemedit="${i.id}">${esc(i.title)}</span><button class="promote" data-promote="${i.id}">Schedule</button><button class="idel" data-idel="${i.id}">×</button></div>`).join('')}
        <div class="area-add"><input type="text" placeholder="New item…" data-areainput="${a.id}"><button data-areaaddbtn="${a.id}">Add</button></div>
      </div></div>`;
  });
  document.getElementById('inboxWrap').innerHTML = html;
  document.querySelectorAll('[data-areatoggle]').forEach(el=>{ el.onclick=()=>{ state._areaOpen=(state._areaOpen===el.dataset.areatoggle)?null:el.dataset.areatoggle; renderInbox(); }; });
  document.querySelectorAll('[data-areaaddbtn]').forEach(el=>{
    el.onclick = async ()=>{ const input=document.querySelector(`[data-areainput="${el.dataset.areaaddbtn}"]`); const title=input.value.trim(); if(!title) return;
      state.items.push({id:uid(), title, areaId:el.dataset.areaaddbtn, today:false, completed:false}); await save(); renderInbox(); showToast('Added to inbox'); };
  });
  document.querySelectorAll('[data-promote]').forEach(el=>{
    el.onclick = ()=>{ const item=state.items.find(x=>x.id===el.dataset.promote); item.today=true; save(); renderInbox(); showToast('Marked as Today'); };
  });
  document.querySelectorAll('[data-idel]').forEach(el=>{
    el.onclick = async ()=>{ state.items = state.items.filter(x=>x.id!==el.dataset.idel); await save(); renderInbox(); renderDrawer(); showToast('Deleted'); };
  });
  document.querySelectorAll('[data-itemedit]').forEach(el=>{ el.onclick = ()=> openEditItem(el.dataset.itemedit); });
}

function renderSettings(){
  const P = state.prayerTimes;
  document.getElementById('prFajr').value = P.fajr;
  document.getElementById('prDhuhr').value = P.dhuhr;
  document.getElementById('prAsr').value = P.asr;
  document.getElementById('prMaghrib').value = P.maghrib;
  document.getElementById('prIsha').value = P.isha;
}
document.getElementById('savePrayerBtn').onclick = async ()=>{
  state.prayerTimes = {
    fajr: document.getElementById('prFajr').value || state.prayerTimes.fajr,
    dhuhr: document.getElementById('prDhuhr').value || state.prayerTimes.dhuhr,
    asr: document.getElementById('prAsr').value || state.prayerTimes.asr,
    maghrib: document.getElementById('prMaghrib').value || state.prayerTimes.maghrib,
    isha: document.getElementById('prIsha').value || state.prayerTimes.isha,
  };
  await save(); renderTimeline(); showToast('Prayer times updated');
};

function renderAll(){ renderHeader(); renderStrip(); renderTimeline(); renderDrawer(); renderWeek(); renderInbox(); renderSettings(); }

document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view'+el.dataset.view.charAt(0).toUpperCase()+el.dataset.view.slice(1)).classList.add('active');
    document.getElementById('drawer').style.display = el.dataset.view==='today' ? 'block':'none';
  };
});
function openSettingsView(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('viewSettings').classList.add('active');
  document.getElementById('drawer').style.display='none';
}
document.getElementById('navSettings').onclick = openSettingsView;
document.getElementById('settingsBtn').onclick = openSettingsView;

// ---- Unified edit/capture sheet ----
const dowGroup = document.getElementById('dowGroup');
dowGroup.innerHTML = DOW.map((d,i)=>`<div class="dow" data-d="${i}">${d}</div>`).join('');
dowGroup.querySelectorAll('.dow').forEach(el=>{
  el.onclick = ()=>{ const d=parseInt(el.dataset.d); if(captureDows.has(d)){captureDows.delete(d); el.classList.remove('selected');} else {captureDows.add(d); el.classList.add('selected');} };
});
document.getElementById('fRepeat').onchange = (e)=>{ captureRepeat=e.target.value; document.getElementById('dowField').style.display = captureRepeat==='weekly'?'block':'none'; };
document.getElementById('moreToggle').onclick = ()=> document.getElementById('moreFields').classList.toggle('open');
document.getElementById('chipToday').onclick = function(){ captureToday=!captureToday; this.classList.toggle('selected'); };

const areaSelect = document.getElementById('fArea');
areaSelect.innerHTML = state ? '' : '';
function populateAreaSelect(){ areaSelect.innerHTML = state.areas.map(a=>`<option value="${a.id}">${a.name}</option>`).join(''); }

function resetSheet(){
  document.getElementById('captureInput').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fRepeat').value='none';
  captureRepeat='none'; captureDows.clear(); captureToday=false;
  document.getElementById('chipToday').classList.remove('selected');
  document.getElementById('dowField').style.display='none';
  document.getElementById('moreFields').classList.remove('open');
  document.getElementById('captureDelete').style.display='none';
  dowGroup.querySelectorAll('.dow').forEach(d=>d.classList.remove('selected'));
}

function openCapture(opts){
  opts = opts || {};
  editKind='item'; editId=null;
  resetSheet();
  populateAreaSelect();
  document.getElementById('areaField').style.display='block';
  document.getElementById('timeField').style.display='none';
  document.getElementById('repeatField').style.display='none';
  captureToday = !!opts.defaultToday;
  document.getElementById('chipToday').classList.toggle('selected', captureToday);
  document.getElementById('captureBackdrop').classList.add('open');
  setTimeout(()=> document.getElementById('captureInput').focus(), 100);
}

function openEditItem(id){
  const item = state.items.find(x=>x.id===id); if(!item) return;
  editKind='item'; editId=id;
  resetSheet();
  populateAreaSelect();
  document.getElementById('captureInput').value = item.title;
  document.getElementById('fNotes').value = item.notes || '';
  areaSelect.value = item.areaId;
  captureToday = !!item.today;
  document.getElementById('chipToday').classList.toggle('selected', captureToday);
  document.getElementById('areaField').style.display='block';
  document.getElementById('timeField').style.display='none';
  document.getElementById('repeatField').style.display='none';
  document.getElementById('captureDelete').style.display='block';
  document.getElementById('captureBackdrop').classList.add('open');
}

function openEditBlock(id){
  const block = state.blocks.find(x=>x.id===id); if(!block) return;
  editKind='block'; editId=id;
  resetSheet();
  document.getElementById('captureInput').value = block.title;
  document.getElementById('fNotes').value = block.sub || '';
  document.getElementById('fTime').value = block.time;
  document.getElementById('fEndTime').value = block.endTime || '';
  document.getElementById('areaField').style.display='none';
  document.getElementById('timeField').style.display='block';
  document.getElementById('repeatField').style.display='block';
  document.getElementById('fRepeat').value = block.days.length===7 ? 'daily' : 'weekly';
  captureRepeat = block.days.length===7 ? 'daily' : 'weekly';
  document.getElementById('dowField').style.display = captureRepeat==='weekly' ? 'block':'none';
  block.days.forEach(d=>{ captureDows.add(d); const el=dowGroup.querySelector(`[data-d="${d}"]`); if(el) el.classList.add('selected'); });
  document.getElementById('captureDelete').style.display='block';
  document.getElementById('moreFields').classList.add('open');
  document.getElementById('captureBackdrop').classList.add('open');
}

function openEditRoutineMeta(id){
  const r = state.routines.find(x=>x.id===id); if(!r) return;
  editKind='routine'; editId=id;
  resetSheet();
  document.getElementById('captureInput').value = r.title;
  document.getElementById('areaField').style.display='none';
  document.getElementById('timeField').style.display='block';
  document.getElementById('fTime').value = r.time;
  document.getElementById('repeatField').style.display='none';
  document.getElementById('dowField').style.display='block';
  document.getElementById('moreFields').classList.add('open');
  r.days.forEach(d=>{ captureDows.add(d); const el=dowGroup.querySelector(`[data-d="${d}"]`); if(el) el.classList.add('selected'); });
  document.getElementById('captureDelete').style.display='block';
  document.getElementById('captureBackdrop').classList.add('open');
}

document.getElementById('headerAddBtn').onclick = ()=> openCapture({});
document.getElementById('captureCancel').onclick = ()=> document.getElementById('captureBackdrop').classList.remove('open');
document.getElementById('captureBackdrop').onclick = (e)=>{ if(e.target.id==='captureBackdrop') e.currentTarget.classList.remove('open'); };

document.getElementById('captureDelete').onclick = async ()=>{
  if(editKind==='item'){ state.items = state.items.filter(x=>x.id!==editId); }
  else if(editKind==='block'){ state.blocks = state.blocks.filter(x=>x.id!==editId); }
  else if(editKind==='routine'){ state.routines = state.routines.filter(x=>x.id!==editId); }
  await save();
  document.getElementById('captureBackdrop').classList.remove('open');
  renderAll(); showToast('Deleted');
};

document.getElementById('captureSave').onclick = async ()=>{
  const title = document.getElementById('captureInput').value.trim();
  if(!title){ showToast('Write something first'); return; }

  if(editKind==='item'){
    if(editId){
      const item = state.items.find(x=>x.id===editId);
      item.title = title; item.notes = document.getElementById('fNotes').value.trim();
      item.areaId = areaSelect.value; item.today = captureToday;
    } else {
      state.items.push({id:uid(), title, areaId: areaSelect.value, today: captureToday, completed:false, notes: document.getElementById('fNotes').value.trim()});
    }
  } else if(editKind==='block'){
    const block = state.blocks.find(x=>x.id===editId);
    block.title = title; block.sub = document.getElementById('fNotes').value.trim();
    block.time = document.getElementById('fTime').value || block.time;
    block.endTime = document.getElementById('fEndTime').value || null;
    block.days = captureRepeat==='daily' ? [0,1,2,3,4,5,6] : Array.from(captureDows).sort();
    if(block.days.length===0) block.days=[0,1,2,3,4,5,6];
  } else if(editKind==='routine'){
    const r = state.routines.find(x=>x.id===editId);
    r.title = title; r.time = document.getElementById('fTime').value || r.time;
    r.days = Array.from(captureDows).sort();
    if(r.days.length===0) r.days=[0,1,2,3,4,5,6];
  }
  await save();
  document.getElementById('captureBackdrop').classList.remove('open');
  renderAll();
  showToast('Saved');
};

(async ()=>{
  await loadData();
  renderAll();
  setInterval(renderTimeline, 60000);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(e=>console.log('SW failed', e));
  });
}
</script>
